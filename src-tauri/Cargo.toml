[package]
name = "levis"
version = "0.8.12"
description = "Levis Markdown Editor"
authors = ["you"]
edition = "2021"

[workspace]
members = ["crates/aicompat"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "levis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for transparent webview windows (the floating
# drag-pill window a tab turns into while being dragged between windows).
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "sync", "macros", "rt"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
aicompat = { path = "crates/aicompat" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Chat attachment extraction (commands/attachment.rs). Everything the "+"
# button accepts has to become either text in the prompt or a base64 image
# part, so each format needs a reader:
#   pdf-extract  PDF text layer (scanned/image-only PDFs have none, and are
#                reported as such rather than silently attaching nothing)
#   calamine     xlsx/xls/xlsb/ods, rendered as one markdown table per sheet
#   zip + quick-xml  docx and pptx are OOXML: a zip of XML parts, and pulling
#                the text runs out of them is a few dozen lines - far less
#                risk than a do-everything crate (dotext, last released 2019)
#                that would tie three formats to one unmaintained dependency.
pdf-extract = "0.12"
calamine = "0.36"
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.41"

# macOS-native PDF export (commands/export.rs). Only macOS needs native code:
# wry's window.print() is broken there (Windows/Linux use window.print()
# straight from the frontend), so the themed document is rendered in an
# offscreen WKWebView with createPDF and cut into A4 sheets with PDFKit.
# Versions and most of the objc2 ecosystem are already in the tree via wry;
# features here switch on the WebKit bits wry doesn't itself use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSURL",
    "NSError",
    "NSObject",
    "NSData",
    "NSDictionary",
    "NSValue",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
    "objc2",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSResponder",
    "NSWindow",
    "NSView",
] }
objc2-web-kit = { version = "0.3", features = [
    "WKWebView",
    "WKWebViewConfiguration",
    "WKNavigation",
    "WKNavigationDelegate",
    "WKPDFConfiguration",
    "WKContentWorld",
    "WKFrameInfo",
    "block2",
    "objc2-core-foundation",
    "objc2-app-kit",
] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = [
    "std",
    "PDFDocument",
    "PDFPage",
    "objc2-core-foundation",
] }
block2 = "0.6"

# Windows/Linux PDF export (commands/export.rs): the webview's own PDF
# renderer driven directly - WebView2's PrintToPdf, WebKitGTK's print-to-file
# operation. Already in the tree via wry; versions must stay on wry's.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"

