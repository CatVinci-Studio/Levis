[package]
name = "tauri-plugin-textus-files"
version = "0.1.0"
edition = "2021"
publish = false
description = "iOS document access for Textus: pickers, security-scoped reads and writes, remembered folders"
links = "tauri-plugin-textus-files"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
