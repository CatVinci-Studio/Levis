name: Bug report / 问题反馈
description: Something doesn't work as it should. / 某个功能没有按预期工作。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search [existing issues](https://github.com/CatVinci-Studio/Levis/issues?q=is%3Aissue) first; if yours is there, a 👍 helps more than a new issue. English or Chinese are both fine.

        感谢反馈。提交前请先搜索[已有的 issue](https://github.com/CatVinci-Studio/Levis/issues?q=is%3Aissue)，如果已经有人提过，点个 👍 比新开一个更有帮助。中文或英文都可以。

  - type: textarea
    id: description
    attributes:
      label: What happened / 发生了什么
      description: What went wrong, and what you expected instead. / 出了什么问题，你原本期望的是什么。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Open ... / 打开 ...
        2. Click ... / 点击 ...
        3. See ... / 看到 ...
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Markdown sample / Markdown 示例
      description: |
        The smallest piece of Markdown that shows the problem, if it involves a document. Saying which built-in guide you used works too.
        如果和文档内容有关，请附上能复现问题的最短 Markdown。说明用的是哪份内置指南也可以。
      render: markdown

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recording / 截图或录屏
      description: A screen recording helps a lot for editing and cursor problems. / 编辑和光标类问题，录屏会很有帮助。

  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - macOS
        - Windows
        - Linux (.deb)
        - Linux (.rpm)
        - Linux (AppImage)
        - Linux (AUR)
        - iPhone / iPad
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version / 系统版本
      placeholder: "macOS 26.1, Windows 11 24H2, Debian 13 GNOME, iOS 26.0 ..."
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version / 应用版本
      description: Shown in Settings → General. / 在 设置 → 通用 中可以看到。
      placeholder: "0.9.7"
    validations:
      required: true

  - type: checkboxes
    id: reproducible
    attributes:
      label: Reproducibility / 是否能稳定复现
      options:
        - label: It happens every time I follow the steps. / 按上面的步骤每次都会出现。
