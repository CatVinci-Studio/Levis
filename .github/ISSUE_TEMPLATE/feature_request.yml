name: Feature request / 功能建议
description: An idea or an improvement. / 一个想法或改进建议。
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search [existing issues](https://github.com/CatVinci-Studio/Textus/issues?q=is%3Aissue) first; a 👍 on a matching one helps us see what matters. English or Chinese are both fine.

        提交前请先搜索[已有的 issue](https://github.com/CatVinci-Studio/Textus/issues?q=is%3Aissue)，给相同的建议点 👍 能帮我们判断优先级。中文或英文都可以。

  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do / 你想做什么
      description: The situation and what gets in the way today. / 使用场景，以及现在遇到的阻碍。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like / 你希望怎样
      description: How you picture it working. / 你设想的使用方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or other apps / 替代方案或其他应用的做法
      description: Workarounds you use now, or how another editor handles it. / 你现在的变通办法，或其他编辑器的做法。

  - type: textarea
    id: context
    attributes:
      label: Anything else / 其他补充
      description: Screenshots, mockups, examples. / 截图、示意图、示例。
