name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild (for example v0.8.11)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # The one place the product's name is spelled for this workflow: the
  # release title and the DMG the Homebrew cask points at.
  PRODUCT_NAME: Textus

permissions:
  contents: write

# One run per tag at a time: a rebuild started while the tag's first run is
# still uploading would race it for the same draft's assets.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Cheap checks on a Linux runner before any macOS/Windows minutes are
  # spent: the tag must name the version the app's files carry, and a
  # stable tag needs its release notes.
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Validate version tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'

      # The checks come from the commit this workflow runs at (so a rebuild
      # of a tag older than scripts/check-versions.mjs still gets them);
      # what they check is the tag.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: tagged

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag matches the app version
        run: node scripts/check-versions.mjs --root tagged --tag "$RELEASE_TAG"

      # Required for a newly pushed stable tag. A rebuild of a tag from
      # before release notes were kept (0.8.10 and older) only warns.
      - name: Release notes exist for a stable tag
        if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
        run: |
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if [ -s "tagged/$notes" ]; then exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::error::$notes is missing at $RELEASE_TAG - write the release notes before tagging."
            exit 1
          fi
          echo "::warning::$notes is missing at $RELEASE_TAG; the release keeps its current notes."

  release:
    needs: preflight
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 is what macos-latest points at today (same arm64
          # pool); pinned so the next image switch is a deliberate change.
          - platform: macos-26
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          # Windows ships the NSIS .exe and nothing else; the target list
          # itself lives in src-tauri/tauri.windows.conf.json, so a local
          # `tauri build` produces the same one artifact this does.
          #
          # It used to bundle MSI as well on stable tags, and that is what
          # made Windows upgrades ask to uninstall first: the two installers
          # register in different places, so neither recognises the other's
          # copy - take the .msi once and the next .exe cannot replace it.
          # MSI also cannot build a pre-release at all ("optional pre-release
          # identifier in app version must be numeric-only ... for msi
          # target"), so rc tags were NSIS-only regardless, and the updater
          # has always shipped NSIS. One installer, one upgrade path.
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      # Older tags predate .gitattributes. Match the source blobs on Windows
      # too, so a rebuild does not fail Prettier after an automatic CRLF checkout.
      - name: Preserve source line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-26' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend before publishing
        run: npm run check

      - name: Test native app before publishing
        run: cargo test --workspace --manifest-path src-tauri/Cargo.toml

      - name: Build and release
        # Pinned to the commit of v0.6.2 (what @v0 resolved to): a moving
        # major tag could change how the release is built between two tags.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (latest.json + .sig files) so
          # installed apps can verify downloads against the pubkey baked
          # into tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization (Gatekeeper). tauri-action
          # imports the base64 .p12 into a temp keychain; the bundler then
          # signs the .app with hardened runtime, notarizes the DMG with
          # notarytool, and staples the ticket. All six secrets must be set
          # together - a partially-configured set fails the macOS build
          # rather than shipping an unsigned DMG.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "${{ env.PRODUCT_NAME }} ${{ env.RELEASE_TAG }}"
          # Keep partial matrix builds away from the updater. The publish
          # job exposes the release only after all three platforms succeed.
          releaseDraft: true
          # A semver pre-release suffix (v0.9.0-rc.1, -beta.2, -alpha) marks
          # the GitHub release as a pre-release. That is what keeps it away
          # from everyone else: the updater endpoint in tauri.conf.json points
          # at `releases/latest/...`, and GitHub's "latest" excludes
          # pre-releases - so a stable install never even sees this build's
          # latest.json. Without this the tag pattern below (v*.*.*) matches
          # an rc tag too and would ship it to every user as the new stable.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: ${{ matrix.args }}

      # textus-bin (packaging/arch/PKGBUILD) installs this tarball. Its
      # binary is a second build with TEXTUS_DISTRIBUTION=aur: it reports new
      # versions but does not install them, because pacman owns /usr/bin.
      # --no-bundle recompiles only the textus crate and skips the installers.
      - name: Build and upload AUR tarball
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEXTUS_DISTRIBUTION: aur
        run: |
          npx tauri build --no-bundle
          scripts/package-linux-tarball.sh "${RELEASE_TAG#v}" \
            src-tauri/target/release/textus dist-aur
          gh release upload "$RELEASE_TAG" dist-aur/* --clobber

  # Builds and tests textus-bin and attaches it to the draft (see
  # arch-package.yml). Before publish, so a broken package keeps the whole
  # release a draft.
  arch-package:
    needs: release
    uses: ./.github/workflows/arch-package.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  publish:
    needs: [release, arch-package]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      newest-stable: ${{ steps.newest.outputs.newest-stable }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # The updater reads latest.json from the newest release the moment it
      # is published. Each platform's build merges its entry into the
      # draft's copy; one that silently failed to (a race, an upload error)
      # would leave every user of that platform without the update.
      - name: Check the draft's updater manifest
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP"
          manifest="$RUNNER_TEMP/latest.json"
          jq '{version, platforms: (.platforms | keys)}' "$manifest"
          version=$(jq -r .version "$manifest")
          if [ "$version" != "${RELEASE_TAG#v}" ]; then
            echo "::error::latest.json says $version, the tag is $RELEASE_TAG"
            exit 1
          fi
          for platform in darwin-aarch64 windows-x86_64 linux-x86_64; do
            if ! jq -e --arg p "$platform" \
              '.platforms[$p] | (.url | length > 0) and (.signature | length > 0)' \
              "$manifest" >/dev/null; then
              echo "::error::latest.json has no signed $platform entry"
              exit 1
            fi
          done

      # A workflow_dispatch rebuild of an old tag republishes that release,
      # but making it "Latest" or pointing the cask or arch-repo at it
      # would downgrade everyone. Asked here, after the builds, not when
      # the run started: a hotfix tag pushed while this one was still
      # building is newer by the time this one is published.
      - name: Is this the newest stable tag?
        id: newest
        run: |
          newest=$(git ls-remote --tags --refs origin 'v*.*.*' \
            | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1)
          echo "Newest stable tag: ${newest:-none}"
          if [ "$newest" = "$RELEASE_TAG" ]; then
            echo "newest-stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest-stable=false" >> "$GITHUB_OUTPUT"
          fi

      # A rebuilt older tag must not become GitHub's "Latest" release: the
      # updater and the website's download links follow releases/latest.
      - name: Publish completed release
        env:
          NEWEST_STABLE: ${{ steps.newest.outputs.newest-stable }}
        run: |
          NOTES="docs/releases/${RELEASE_TAG#v}.md"
          if [ -f "$NOTES" ]; then
            gh release edit "$RELEASE_TAG" --notes-file "$NOTES"
          fi
          if [ "$NEWEST_STABLE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          fi

  # Points the Homebrew cask (CatVinci-Studio/homebrew-tap) at the DMG this
  # release just published, so `brew install --cask catvinci-studio/tap/textus`
  # always serves the newest version. Pushes via a write deploy key on the
  # tap repo (GITHUB_TOKEN can't push to another repository).
  #
  # Only for the newest stable tag. Pre-releases: the cask has no channel of
  # its own, so pointing it at an rc would hand that build to every `brew
  # upgrade` - the same mistake marking the GitHub release as a pre-release
  # exists to prevent. Rebuilds of an older tag: that would downgrade.
  update-homebrew-tap:
    needs: publish
    if: ${{ needs.publish.outputs.newest-stable == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Update cask version and sha256
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          # Loudly: a quietly skipped tap update leaves brew users on the
          # old version with nobody noticing.
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::error::TAP_DEPLOY_KEY is not set - the Homebrew cask was not updated"
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          # The release was published seconds ago; let the CDN catch up.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o textus.dmg \
            "https://github.com/CatVinci-Studio/Textus/releases/download/${RELEASE_TAG}/${PRODUCT_NAME}_${VERSION}_aarch64.dmg"
          SHA=$(sha256sum textus.dmg | cut -d' ' -f1)
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key"
          git clone git@github.com:CatVinci-Studio/homebrew-tap.git
          cd homebrew-tap
          sed -i "s|^  version \".*\"|  version \"${VERSION}\"|" Casks/textus.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Casks/textus.rb
          # A rerun after a successful push has nothing to commit.
          if git diff --quiet; then
            echo "The cask already serves ${VERSION}"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -am "textus ${VERSION}"
          git push

  # Asks the [catvinci] pacman repository (CatVinci-Studio/arch-repo) to
  # serve the textus-bin this release carries (see update-arch-repo.yml).
  # Only for the newest stable tag, like the Homebrew cask: pacman sorts
  # 0.9.0_rc.1 above 0.9.0, and an older tag would downgrade.
  update-arch-repo:
    needs: publish
    if: ${{ needs.publish.outputs.newest-stable == 'true' }}
    uses: ./.github/workflows/update-arch-repo.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
