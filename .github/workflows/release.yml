name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          # Windows ships the NSIS .exe and nothing else; the target list
          # itself lives in src-tauri/tauri.windows.conf.json, so a local
          # `tauri build` produces the same one artifact this does.
          #
          # It used to bundle MSI as well on stable tags, and that is what
          # made Windows upgrades ask to uninstall first: the two installers
          # register in different places, so neither recognises the other's
          # copy - take the .msi once and the next .exe cannot replace it.
          # MSI also cannot build a pre-release at all ("optional pre-release
          # identifier in app version must be numeric-only ... for msi
          # target"), so rc tags were NSIS-only regardless, and the updater
          # has always shipped NSIS. One installer, one upgrade path.
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend before publishing
        run: npm run check

      - name: Test native app before publishing
        run: cargo test --workspace --manifest-path src-tauri/Cargo.toml

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (latest.json + .sig files) so
          # installed apps can verify downloads against the pubkey baked
          # into tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization (Gatekeeper). tauri-action
          # imports the base64 .p12 into a temp keychain; the bundler then
          # signs the .app with hardened runtime, notarizes the DMG with
          # notarytool, and staples the ticket. All six secrets must be set
          # together - a partially-configured set fails the macOS build
          # rather than shipping an unsigned DMG.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Levis ${{ github.ref_name }}"
          # Keep partial matrix builds away from the updater. The publish
          # job exposes the release only after all three platforms succeed.
          releaseDraft: true
          # A semver pre-release suffix (v0.9.0-rc.1, -beta.2, -alpha) marks
          # the GitHub release as a pre-release. That is what keeps it away
          # from everyone else: the updater endpoint in tauri.conf.json points
          # at `releases/latest/...`, and GitHub's "latest" excludes
          # pre-releases - so a stable install never even sees this build's
          # latest.json. Without this the tag pattern below (v*.*.*) matches
          # an rc tag too and would ship it to every user as the new stable.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  publish:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/${RELEASE_TAG#v}.md"
          if [ -f "$NOTES" ]; then
            gh release edit "$RELEASE_TAG" --notes-file "$NOTES"
          fi
          gh release edit "$RELEASE_TAG" --draft=false

  # Points the Homebrew cask (CatVinci-Studio/homebrew-tap) at the DMG this
  # release just published, so `brew install --cask catvinci-studio/tap/levis`
  # always serves the newest version. Pushes via a write deploy key on the
  # tap repo (GITHUB_TOKEN can't push to another repository).
  #
  # Skipped for pre-releases: the cask has no channel of its own, so pointing
  # it at an rc would hand that build to every `brew upgrade` - the same
  # mistake marking the GitHub release as a pre-release exists to prevent.
  update-homebrew-tap:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-22.04
    steps:
      - name: Update cask version and sha256
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "TAP_DEPLOY_KEY not set - skipping tap update"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL -o levis.dmg \
            "https://github.com/CatVinci-Studio/Levis/releases/download/${GITHUB_REF_NAME}/Levis_${VERSION}_aarch64.dmg"
          SHA=$(sha256sum levis.dmg | cut -d' ' -f1)
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key"
          git clone git@github.com:CatVinci-Studio/homebrew-tap.git
          cd homebrew-tap
          sed -i "s|^  version \".*\"|  version \"${VERSION}\"|" Casks/levis.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Casks/levis.rb
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -am "levis ${VERSION}"
          git push
