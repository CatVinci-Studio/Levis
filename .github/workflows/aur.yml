name: AUR

# Builds and tests levis-bin for a published release in an Arch container
# (packaging/arch/ci-check.sh), then pushes PKGBUILD + .SRCINFO to the AUR.
# release.yml calls this after the release is public; run it by hand to
# retry one tag without rebuilding the release.
#
# The push needs the AUR_SSH_PRIVATE_KEY secret: the private half of an SSH
# key registered on the AUR account that maintains levis-bin. Without it
# the job still tests the package and keeps the files as a workflow
# artifact for a manual push.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (for example v0.8.13)
        required: true
        type: string

permissions:
  contents: read

jobs:
  aur:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      # The packaging scripts come from the commit this workflow runs at,
      # not from the tag: a fix on main can then test an older release.
      - uses: actions/checkout@v4

      - name: Build, install, upgrade and remove levis-bin
        run: |
          TAG="${{ inputs.tag }}"
          packaging/arch/ci-check.sh "${TAG#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: levis-bin-${{ inputs.tag }}
          path: |
            /home/builder/levis-bin/PKGBUILD
            /home/builder/levis-bin/.SRCINFO
          include-hidden-files: true

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          # pacman sorts 0.8.13_rc.1 above 0.8.13, so an rc on the AUR would
          # block the stable release for everyone who installed it.
          case "${{ inputs.tag }}" in
            *-*) echo "Pre-release - not pushing to the AUR"; exit 0 ;;
          esac
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY not set - skipping the AUR push"
            exit 0
          fi
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key"
          git clone ssh://aur@aur.archlinux.org/levis-bin.git aur-repo
          cp /home/builder/levis-bin/PKGBUILD /home/builder/levis-bin/.SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR already has levis-bin ${VERSION}-1"
            exit 0
          fi
          git -c user.name="CatVinci Studio" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "levis-bin ${VERSION}-1"
          git push origin HEAD:master
